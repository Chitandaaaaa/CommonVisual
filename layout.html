<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CommonVisual · 通信前后数据布局对照</title>
<meta name="description" content="NCCL 集合通信原语的前后对照：每一行是一张卡的缓冲区，通信前是什么、通信后变成什么，没变化的行置灰。">
<link rel="stylesheet" href="assets/layout.css">
</head>
<body>

<div class="wrap">

  <header class="hd">
    <a class="back" href="home.html">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
        <path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      原语关系树
    </a>
    <h1>通信前后 · 数据布局对照</h1>
    <p class="lead">每一行是一张卡的缓冲区。灰掉的行表示通信前后没有变化 —— 结果只落在该落的那张卡上。</p>

    <ul class="legend">
      <li><i class="cell" style="--c:#7c3aed">A</i><span>数据块</span></li>
      <li><i class="cell" style="--c:#4c1d95">Σ</i><span>求和结果</span></li>
      <li><i class="cell is-blank"></i><span>空缓冲</span></li>
      <li><i class="sw-demo"></i><span>未变化</span></li>
    </ul>
  </header>

  <main id="app"></main>

  <footer class="ft">
    <p>Reduce-Scatter 与 All-to-All 还没做页面，这一版先覆盖已实现的六个原语。</p>
    <a class="back" href="home.html">← 回到原语关系树</a>
  </footer>

</div>

<script src="assets/layout.js"></script>
</body>
</html>
