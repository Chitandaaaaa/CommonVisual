<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>组件与动画总览 · 按文档重画</title>
<style>
  body { margin:0; padding:24px 28px 80px; background:#eef1f7;
         font-family:"Segoe UI","Microsoft YaHei",sans-serif; color:#333a4e; }
  h1 { font-size:22px; margin:8px 0 4px; }
  .sub { color:#6b7488; font-size:13px; margin-bottom:20px; }
  .part { margin-top:34px; }
  .part > h2 { font-size:18px; border-left:4px solid #7c3aed; padding-left:10px; }
  h3.sec { font-size:15px; margin:26px 0 8px; color:#444d66; }
  h3.sec small { color:#8b93aa; font-weight:400; margin-left:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:14px; }
  .grid.mini { grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); }
  .tile { background:#f4f6fb; border:1px solid #dfe3ee; border-radius:10px; padding:10px 10px 6px; }
  .tile svg { display:block; width:100%; height:auto; }
  .mini-t svg { max-width:110px; margin:0 auto; }
  .grid.wide svg { max-width:800px; margin:0 auto; }
  .cap { font-size:12px; color:#6b7488; text-align:center; padding:4px 0 2px;
         font-family:Consolas,monospace; }
  .cap b { color:#444d66; }
  .note { font-size:12.5px; color:#6b7488; background:#fff; border:1px dashed #c9d0e2;
          border-radius:8px; padding:8px 12px; margin:6px 0 10px; }
  .ctrl { display:flex; align-items:center; justify-content:center; gap:26px; height:48px; }
  .sbtn { width:30px; height:30px; display:flex; align-items:center; justify-content:center;
          cursor:pointer; transition:transform .15s; }
  .sbtn:hover { transform:scale(1.14); }
  .sbtn:hover svg * { fill:#161b2e; }
  .pbtn { width:48px; height:48px; border-radius:24px; background:#6b7488; cursor:pointer;
          display:flex; align-items:center; justify-content:center;
          box-shadow:0 4px 12px rgba(90,99,119,.28); transition:all .15s; }
  .pbtn:hover { background:#7d8699; transform:scale(1.07);
          box-shadow:0 8px 20px rgba(90,99,119,.32); }
  .track { position:relative; height:16px; cursor:pointer; }
  .track .seg { position:absolute; top:6px; height:3px; border-radius:2px; background:#e6e9f0; overflow:hidden; }
  .track .seg > i { position:absolute; left:0; top:0; bottom:0; background:#8b93a6; display:block; }
  .track:hover .seg { top:5px; height:4px; }
</style>
</head>
<body>
<h1>组件与动画总览</h1>
<div class="sub">按《组件文档》每个二级标题（含全部类型）画一份静态样本；按《特效动画》每个二级标题跑一个循环演示。
零依赖：不引用 v1/assets/ 任何代码，数值全部照抄两份文档，file:// 直接打开。</div>

<div class="part" id="part-c"><h2>第一部分 · 组件（画自《组件文档》）</h2></div>
<div id="comp"></div>

<div class="part" id="part-a"><h2>第二部分 · 动画（跑自《特效动画》）</h2></div>
<div id="anim"></div>

<script>
'use strict';
/* ================= 核心 ================= */
const NS = 'http://www.w3.org/2000/svg';
let UID = 0;
function E(t, a, p) { const n = document.createElementNS(NS, t);
  for (const k in a) n.setAttribute(k, a[k]); if (p) p.appendChild(n); return n; }
function SEC(parent, num, name, note) {
  const h = document.createElement('h3'); h.className = 'sec';
  h.innerHTML = num + ' ' + name + (note ? '<small>' + note + '</small>' : '');
  parent.appendChild(h);
  if (note) { const n = document.createElement('div'); n.className = 'note'; n.innerHTML = note; parent.appendChild(n); }
  const g = document.createElement('div'); g.className = 'grid'; parent.appendChild(g);
  return g;
}
function TILE(grid, w, h, cap) {
  const t = document.createElement('div'); t.className = 'tile'; grid.appendChild(t);
  const s = E('svg', { viewBox: '0 0 ' + w + ' ' + h }, t);
  if (cap) { const c = document.createElement('div'); c.className = 'cap'; c.innerHTML = cap; t.appendChild(c); }
  return s;
}
function MONO(grid, w, h, cap) { // 小样本网格用
  const t = document.createElement('div'); t.className = 'tile mini-t'; grid.appendChild(t);
  const s = E('svg', { viewBox: '0 0 ' + w + ' ' + h }, t);
  if (cap) { const c = document.createElement('div'); c.className = 'cap'; c.innerHTML = cap; t.appendChild(c); }
  return s;
}
/* 0.1 数据四色 / 0.2 连线灰 */
const DATA = { A: '#7c3aed', B: '#0891b2', C: '#059669', D: '#d97706' };
const GRAY = '#c3cadb';
/* 0.3 规约块底色 */
const SIG = { A2:'#6931ca',A3:'#5629a6',A4:'#442083',B2:'#0b789a',B3:'#0e5f82',B4:'#12466a',
              C2:'#097c5f',C3:'#0d6254',C4:'#10484a',D2:'#b5630f',D3:'#904f17',D4:'#6c3b20' };
const MONO_FONT = 'Consolas,monospace';
const RLETTER = ['A', 'B', 'C', 'D']; // rank 序号 → 字母

function defsOf(svg) { let d = svg.querySelector('defs');
  if (!d) d = E('defs', {}, svg); return d; }
function fShadow(svg, id, dy, blur, color, op) { // 投影/外发光滤镜
  const f = E('filter', { id: id, x: '-60%', y: '-60%', width: '220%', height: '220%' }, defsOf(svg));
  E('feDropShadow', { dx: 0, dy: dy, stdDeviation: blur / 2, 'flood-color': color, 'flood-opacity': op }, f);
  return 'url(#' + id + ')';
}
/* 拖尾滤镜：与 v1/assets/parts/stage.js 的 fTrail 同构 —— feDropShadow 只在块外补一层软影，
   块本体不透明度由浓度直接给。早期这里用 feGaussianBlur + feFuncA(0.14) 作用在色块上，
   alpha 被乘成 0.14，再乘浓度 0.55 → 实际 0.077，拖尾几乎看不见（2026-11-09 修）。 */
function fTrail(svg, id, std, op) {
  const f = E('filter', { id: id, x: '-90%', y: '-90%', width: '280%', height: '280%' }, defsOf(svg));
  E('feDropShadow', { dx: 0, dy: 0, stdDeviation: std, 'flood-color': '#2a3352', 'flood-opacity': op }, f);
  return 'url(#' + id + ')';
}
function mix(h1, h2, t) { // 颜色插值（动画演示用）
  const a = [1, 3, 5].map(i => parseInt(h1.substr(i, 2), 16));
  const b = [1, 3, 5].map(i => parseInt(h2.substr(i, 2), 16));
  return '#' + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
/* 10.2 变化方式四条曲线 */
const CURVES = {
  lin: p => p,
  qin: p => p * p,
  io:  p => p < .5 ? 2 * p * p : 1 - (2 - 2 * p) * (2 - 2 * p) / 2,
  pop(q) { // 过冲回弹：三档点 + 贝塞尔(0.2,0.9,0.3,1.45)，缩放跟冲、透明不跟冲
    const S = [{ t: 0, k: .35, o: 0 }, { t: .55, k: 1.16, o: 1 }, { t: 1, k: 1, o: 1 }];
    q = q < 0 ? 0 : q > 1 ? 1 : q;
    let i = 0; while (i < S.length - 2 && q > S[i + 1].t) i++;
    const a = S[i], b = S[i + 1], u = (q - a.t) / (b.t - a.t);
    const e = CURVES.bez(u, .2, .9, .3, 1.45);
    return { k: a.k + (b.k - a.k) * e, o: Math.min(1, a.o + (b.o - a.o) * e) };
  },
  bez(t, x1, y1, x2, y2) { // cubic-bezier 求值
    const fx = t => ((1 - t) ** 3) * 0 + 3 * (1 - t) ** 2 * t * x1 + 3 * (1 - t) * t * t * x2 + t ** 3 * 1;
    const fy = t => ((1 - t) ** 3) * 0 + 3 * (1 - t) ** 2 * t * y1 + 3 * (1 - t) * t * t * y2 + t ** 3 * 1;
    let lo = 0, hi = 1, m;
    for (let j = 0; j < 24; j++) { m = (lo + hi) / 2; if (fx(m) < t) lo = m; else hi = m; }
    return fy((lo + hi) / 2);
  }
};
/* 循环驱动：每个演示注册 render(t)，t∈[0,period) 自动回绕 */
const LOOPS = [];
function LOOP(period, render) { LOOPS.push({ period, render }); }
let T0 = performance.now();
function tick(now) {
  const t = (now - T0) / 1000;
  for (const L of LOOPS) L.render(t % L.period);
  requestAnimationFrame(tick);
}

/* 上下标基线偏移（2.2.2 / 2.3.2）：规范值是写死的像素（46 基准），不用 em/倍数。
   SVG 里 tspan 的 dy 用 em 时按**该 tspan 自身**的 font-size 换算，不按父级 ——
   旧稿把 0.34em / 1.28em 乘父级 15 得到 5.1 / 19.2，照它画上标会飞出色块顶（已修）。
   tspan 的 dy 是逐段累计的，所以上标那段要写「两段之和」：-(3.2 + 6.8) = -10。 */
const SCRIPT = { sub: 3.2, sup: 6.8 };

/* ================= 部件画法 ================= */
/* 数据块（2.1–2.6）：state = data|empty|recv|dim；letter/sub/cnt/color 可选 */
function block(g, x, y, size, st, o) {
  o = o || {};
  const r = E('g', {}, g);
  const s = size, rx = s * 8 / 46;
  const rect = E('rect', { x: x, y: y, width: s, height: s, rx: rx }, r);
  const tx = E('text', { x: x + s / 2, y: y + s / 2, 'text-anchor': 'middle',
    'dominant-baseline': 'central', 'font-family': MONO_FONT, 'font-weight': 700,
    'font-size': s * 15 / 46 }, r);
  /* 上下标（2.2.2 / 2.3.2）：字号 9.3 / 7.8（46 基准）等比缩；
     基线偏移走《上下标基线偏移》——写死的像素，同样按块尺寸等比缩。 */
  function span(node, s2, dyPx, w) { // dyPx = 46 基准的像素位移
    const fs = s * s2 / 46;
    const sp = E('tspan', { 'font-size': fs, dy: dyPx * s / 46,
      'font-weight': w || 700 }, node); return sp;
  }
  if (st === 'data' || st === 'dim') {
    const base = o.color || DATA[o.letter || 'A'];
    rect.setAttribute('fill', st === 'dim' ? '#e4e8f0' : base);
    r.setAttribute('opacity', st === 'dim' ? 0.78 : 1);
    tx.setAttribute('fill', st === 'dim' ? '#b7becc' : '#ffffff');
    tx.appendChild(document.createTextNode(o.letter || 'A'));
    if (o.sub != null) span(tx, 9.3, SCRIPT.sub).textContent = o.sub;
    if (o.cnt != null) {
      const sp = span(tx, 7.8, -(SCRIPT.sub + SCRIPT.sup), 600);
      sp.textContent = o.cnt;
    }
  } else if (st === 'empty') {
    rect.setAttribute('fill', '#f7f8fc');
    rect.setAttribute('stroke', '#d5dae8'); rect.setAttribute('stroke-width', 1.3);
    rect.setAttribute('stroke-dasharray', '4 3');
    tx.setAttribute('fill', '#b9c0d2');
  } else if (st === 'recv') {
    rect.setAttribute('fill', '#f3eeff');
    rect.setAttribute('stroke', '#a78bfa'); rect.setAttribute('stroke-width', 1.3);
    tx.setAttribute('fill', '#a78bfa'); tx.textContent = '···';
  }
  return r;
}
/* 数据格行 */
function slotRow(g, x0, y, n, states, o) {
  o = o || {}; const sw = o.sw || 46, gap = o.gap || 12, out = [];
  for (let i = 0; i < n; i++)
    out.push(block(g, x0 + i * (sw + gap), y, sw, states[i].st, states[i]));
  return out;
}
/* 徽章（3.1–3.4） */
function badge(g, x, y, kind, text, st) {
  st = st || 'n';
  const w = kind === 'role' ? (text === 'dst' ? 30 : 28) : 36, h = 18;
  const r = E('g', {}, g);
  E('rect', { x: x, y: y, width: w, height: h, rx: 6,
    fill: st === 'dim' ? 'rgba(158,168,188,.12)' : 'rgba(255,255,255,.26)' }, r);
  const tx = E('text', { x: x + w / 2, y: y + h / 2, 'text-anchor': 'middle',
    'dominant-baseline': 'central', 'font-family': MONO_FONT, 'font-weight': 700,
    'font-size': 10, 'letter-spacing': 0.6,
    fill: st === 'dim' ? '#b8bfcd' : '#ffffff' }, r);
  tx.textContent = text;
  return r;
}
/* 卡片（1.1–1.5）：variant = idle|send|recv|dim；rows = [{y, states:[…]}] */
function cardG(svg, g, o) {
  o = o || {};
  const x = o.x || 0, y = o.y || 0, w = o.w || 300, h = o.h || 170;
  const color = o.color || DATA[RLETTER[o.rank || 0]] || '#7c3aed';
  const dim = o.variant === 'dim';
  const r = E('g', {}, g);
  let stroke = '#e3e7f0', sw = 1, filt = fShadow(svg, 'fc' + (++UID), 6, 12, '#2a3352', 0.1);
  if (o.variant === 'send') { stroke = color; sw = 2.5; filt = fShadow(svg, 'fs' + (++UID), 0, 5, color, 0.53); }
  if (o.variant === 'recv') { stroke = '#c9b6f7'; sw = 1.8; }
  if (dim) stroke = '#eef1f8';
  E('rect', { x: x, y: y, width: w, height: h, rx: 14, fill: '#ffffff',
    stroke: stroke, 'stroke-width': sw, filter: filt }, r);
  E('path', { d: 'M ' + x + ' ' + (y + 36) + ' L ' + x + ' ' + (y + 14) +
    ' A 14 14 0 0 1 ' + (x + 14) + ' ' + y + ' L ' + (x + w - 14) + ' ' + y +
    ' A 14 14 0 0 1 ' + (x + w) + ' ' + (y + 14) + ' L ' + (x + w) + ' ' + (y + 36) + ' Z',
    fill: dim ? '#e8ecf4' : color }, r);
  const tt = E('text', { x: x + 16, y: y + 24.5, 'text-anchor': 'start',
    'font-size': 15, 'font-weight': 700, fill: dim ? '#aeb6c7' : '#ffffff' }, r);
  tt.textContent = o.title || ('rank' + (o.rank != null ? o.rank : 0));
  if (o.badge) badge(r, x + w - 14 - (o.badge.w || 28), y + 9, o.badge.kind, o.badge.text,
    dim ? 'dim' : 'n');
  if (o.rows) { const n = o.rowN || 4;
    for (const row of o.rows)
      slotRow(r, x + (w - n * 46 - (n - 1) * 12) / 2, row.y, n, row.states, o); }
  return r;
}
/* 箭头 marker（4.1.2：平头小三角 —— 尖是一小段平边、底边贴满外框左边）
   路径与 v1/assets/parts/payload.js 的 CV.payload.marker 同一份：viewBox 8 宽，
   size = 箭头大小（11 / 14.3 / 9.9 ＝ 5.5 × 线宽）。 */
function markerOf(svg, color, size) {
  const id = 'ar' + (++UID);
  const m = E('marker', { id: id, viewBox: '0 0 8 8', refX: 8, refY: 4,
    markerWidth: size, markerHeight: size, markerUnits: 'userSpaceOnUse',
    orient: 'auto' }, defsOf(svg));
  E('path', { d: 'M 0 0 L 8 3.27 L 8 4.73 L 0 8 Z', fill: color }, m);
  return 'url(#' + id + ')';
}
/* 弧线（4.1.1）：S 形，曲率 0.42。
   控制点沿**主轴**摆（geom.js · CV.arcPath）：横长的线水平进/水平出，纵长的
   线垂直进/垂直出。两端等高时四点共线、贝塞尔退化成直线 —— 所以样片里两端
   必须有高差，别摆成同一水平线。 */
function arcPath(sx, sy, tx, ty, k) {
  k = k == null ? 0.42 : k;
  const dx = tx - sx, dy = ty - sy;
  if (Math.abs(dx) >= Math.abs(dy))
    return 'M ' + sx + ' ' + sy + ' C ' + (sx + dx * k) + ' ' + sy + ', ' +
           (tx - dx * k) + ' ' + ty + ', ' + tx + ' ' + ty;
  return 'M ' + sx + ' ' + sy + ' C ' + sx + ' ' + (sy + dy * k) + ', ' +
         tx + ' ' + (ty - dy * k) + ', ' + tx + ' ' + ty;
}
/* 数据包（5.1–5.4）：dir = 弧度制朝向，拖尾永远拖在来路上。
   sig 有值时包内装的是规约块：文字按 5.4.1 缩放 0.52，单块 / 两块 / 四块款同一套字号。 */
function packetG(svg, g, x, y, kind, colors, deg, sig) {
  const r = E('g', { transform: 'translate(' + x + ' ' + y + ') rotate(' + (deg || 0) + ')' }, g);
  const glow = fShadow(svg, 'pg' + (++UID), 0, 8, '#2a3352', 0.22);
  function trail(d, size, rx, op, std, color) {
    E('rect', { x: -d - size / 2, y: -size / 2, width: size, height: size, rx: rx,
      fill: color || colors[0], filter: fTrail(svg, 'tb' + (++UID), std, 0.14), opacity: op }, r);
  }
  if (kind === 1) {
    trail(46, 9.6, 2.7, 0.28, 3); trail(24, 16, 4.4, 0.55, 4);
    E('rect', { x: -12, y: -12, width: 24, height: 24, rx: 6.5, fill: colors[0], filter: glow }, r);
    if (sig) sigText(r, 0, 0, sig, 24 / 46);
    else {
      const t = E('text', { x: 0, y: 0, 'text-anchor': 'middle', 'dominant-baseline': 'central',
        'font-family': MONO_FONT, 'font-weight': 700, 'font-size': 13, fill: '#fff' }, r);
      t.textContent = colors.txt;
    }
  } else {
    const n = kind === 2 ? 2 : 4, bw = 20, gap = 3, pad = 6;
    const bwAll = n * bw + (n - 1) * gap;
    /* 按《组件文档》5.2.4 / 5.2.5：拖尾「复用 5.1.3 / 5.1.4」，本节只改浓度 0.48 / 0.24；
       其余取 5.1.3 / 5.1.4 原值（16 / 9.6 方块，退后 24 / 46，滤镜模糊 4 / 3、滤镜不透明度 0.14）。
       底色取第一块的数据色（见 0.1）。 */
    trail(46, 9.6, 2.7, 0.24, 3, colors[0].c);
    trail(24, 16, 4.4, 0.48, 4, colors[0].c);
    E('rect', { x: -bwAll / 2 - pad, y: -16, width: bwAll + pad * 2, height: 32, rx: 10,
      fill: 'rgba(255,255,255,.97)', filter: glow }, r);
    for (let i = 0; i < n; i++) {
      const bx = -bwAll / 2 + i * (bw + gap);
      E('rect', { x: bx, y: -10, width: bw, height: 20, rx: 5, fill: colors[i].c }, r);
      if (colors[i].key) { sigText(r, bx + bw / 2, 0, colors[i].key, 24 / 46); continue; }
      const t = E('text', { x: bx + bw / 2, y: 0, 'text-anchor': 'middle',
        'dominant-baseline': 'central', 'font-family': MONO_FONT, 'font-weight': 700,
        'font-size': 11, fill: '#fff' }, r);
      t.textContent = colors[i].t;
    }
  }
  return r;
}
/* 规约块文字（2.3.2 的 Σ＋下标列字母＋上标份数，按块尺寸等比缩）：k = 块尺寸 ÷ 46。
   key 形如 'A2'（列字母 + 份数）。与 block() 的字号/偏移同一套算式，
   只是不画方块（方块由包体或小块自己给）。 */
function sigText(parent, cx, cy, key, k) {
  const tx = E('text', { x: cx, y: cy, 'text-anchor': 'middle', 'dominant-baseline': 'central',
    'font-family': MONO_FONT, 'font-weight': 700, 'font-size': 15 * k, fill: '#fff' }, parent);
  tx.appendChild(document.createTextNode('Σ'));
  E('tspan', { 'font-size': 9.3 * k, dy: SCRIPT.sub * k, 'font-weight': 700 },
    tx).textContent = key[0];
  E('tspan', { 'font-size': 7.8 * k, dy: -(SCRIPT.sub + SCRIPT.sup) * k, 'font-weight': 600 },
    tx).textContent = key[1];
  return tx;
}

/* ================= 第一部分 · 组件 ================= */
const comp = document.getElementById('comp');
let grid, s;

/* ---- 0 通用 ---- */
grid = SEC(comp, '0.1', '数据四色', '同一份数据在任何位置都是同一种颜色');
for (const k of ['A', 'B', 'C', 'D']) {
  s = MONO(grid, 80, 80, 'rank ' + '0123' [['A','B','C','D'].indexOf(k)] + ' · ' + k);
  E('rect', { x: 17, y: 17, width: 46, height: 46, rx: 8, fill: DATA[k] }, s);
  const t = E('text', { x: 40, y: 40, 'text-anchor': 'middle', 'dominant-baseline': 'central',
    'font-family': MONO_FONT, 'font-weight': 700, 'font-size': 15, fill: '#fff' }, s);
  t.textContent = k;
}
grid = SEC(comp, '0.2', '连线灰');
s = MONO(grid, 120, 60);
E('line', { x1: 12, y1: 30, x2: 108, y2: 30, stroke: GRAY, 'stroke-width': 2, 'stroke-dasharray': '8 7' }, s);
s = MONO(grid, 120, 60, '箭头');
E('line', { x1: 12, y1: 30, x2: 96, y2: 30, stroke: GRAY, 'stroke-width': 2, 'stroke-dasharray': '8 7',
  'marker-end': markerOf(s, GRAY, 11) }, s);
grid = SEC(comp, '0.3', '规约块底色', '12 种内容各一个固定底色，直接查表');
for (const k in SIG) {
  s = MONO(grid, 80, 80, k);
  block(s, 17, 17, 46, 'data', { letter: 'Σ', sub: k[0], cnt: k[1], color: SIG[k] });

  const g2 = E('rect', { x: -4.8, y: -4.8, width: 9.6, height: 9.6, rx: 2.7, fill: DATA.B, opacity: 0 }, mv);
  const gloss = E('rect', { x: 40, y: 97.5, width: 46, height: 46, rx: 8, fill: '#ffffff', opacity: 0 }, s);
  const CX = 63, CY0 = 163.5, CY1 = 105.5;
  LOOP(2.7, t => {
    const fuse = t >= 0.9 && t < 1.32;
    const p = fuse ? (t - 0.9) / 0.42 : (t >= 1.32 ? 1 : 0);
    const wake = Math.min(1, p / 0.16);
    const rise = CURVES.io(Math.max(0, Math.min(1, (p - 0.16) / (0.72 - 0.16))));
    const op = 1 - CURVES.io(Math.max(0, Math.min(1, (p - 0.45) / 0.33)));
    const sc = 1 - 0.64 * rise;
    const cy = CY0 + (CY1 - CY0) * rise;
    mvRect.setAttribute('fill', mix(DATA.B, '#ffffff', 0.30 * wake));
    mv.setAttribute('transform', 'translate(' + CX + ' ' + cy + ') scale(' + sc + ')');
    mv.setAttribute('opacity', Math.max(0, p >= 1 ? 0 : op));
    g1.setAttribute('transform', 'translate(' + (CX - 23 * 0.8) + ' ' + (cy + 18 - 8) + ') scale(0.8)');
    g2.setAttribute('transform', 'translate(' + (CX - 23 * 0.6) + ' ' + (cy + 30 - 4.8) + ') scale(0.6)');
    g1.setAttribute('opacity', (op * 0.40 * rise).toFixed(3));
    g2.setAttribute('opacity', (op * 0.20 * rise).toFixed(3));
    const gs = Math.max(0.45, 0.78 - 0.23), ge = Math.min(1, 0.78 + 0.22);
    const gp = Math.max(0, Math.min(1, (p - gs) / (ge - gs)));
    gloss.setAttribute('opacity', (Math.sin(Math.PI * gp) * 0.9).toFixed(3));
    const merged = p >= 0.78;
    topB.setAttribute('opacity', merged ? 0 : 1);
    topS.setAttribute('opacity', merged ? 1 : 0);
  });
}
/* ---- 第 7 章 计算层与方牌 ---- */
grid = DSEC('第 7 章 计算层与方牌', '伸长 growDur 0.75s · 方牌浮现/消失 calcFade 0.35s · 缩回 shrinkDur 0.7s');
function calcCard(svg) { // 双排卡＋下排＋方牌（隐藏），返回 {setH, chip}
  const c = animCard(svg, 20, 15, { h: 249, rank: 1, badge: { kind: 'role', text: 'dst', w: 30 } });
  for (let i = 0; i < 4; i++) { block(c.g, 40 + i * 58, 82.5, 46, i === 0 ? 'data' : 'empty', { letter: 'B' });
    block(c.g, 40 + i * 58, 140.5, 46, 'empty'); }
  const chip = E('g', { transform: 'translate(170 226)' }, c.g);
  E('rect', { x: -28, y: -11, width: 56, height: 22, rx: 7, fill: '#fbfaff',
    stroke: '#d7d2ea', 'stroke-width': 1.2 }, chip);
  const t = E('text', { x: 0, y: 0, 'text-anchor': 'middle', 'dominant-baseline': 'central',
    'font-size': 11.5, 'font-weight': 600, 'letter-spacing': 0.46, fill: '#6a5f8a' }, chip);
  t.textContent = '计算';
  chip.setAttribute('opacity', 0);
  return { setH: c.setH, chip: chip };
}
{
  const s = dtile(grid, '7.1 出计算层 · growDur 0.75s · 先慢后快再慢（底边伸长亮出计算层）');
  const cc = calcCard(s);
  LOOP(2.0, t => {
    const u = t < 0.5 ? 0 : t < 1.25 ? CURVES.io((t - 0.5) / 0.75) : 1;
    cc.setH(203 + 46 * u); cc.chip.setAttribute('opacity', 0);
  });
}
{
  const s = dtile(grid, '7.2 显示计算方牌 · calcFade 0.35s · 匀速（透明→完全显示）');
  const cc = calcCard(s);
  LOOP(2.4, t => {
    cc.setH(249);
    cc.chip.setAttribute('opacity', t < 1.0 ? 0 : t < 1.35 ? CURVES.lin((t - 1.0) / 0.35) : 1);
  });
}
{
  const s = dtile(grid, '7.3 隐藏计算方牌 · calcFade 0.35s · 匀速（完全显示→透明）');
  const cc = calcCard(s);
  LOOP(2.4, t => {
    cc.setH(249);
    cc.chip.setAttribute('opacity', t < 1.0 ? 1 : t < 1.35 ? 1 - CURVES.lin((t - 1.0) / 0.35) : 0);
  });
}
{
  const s = dtile(grid, '7.4 隐藏计算层 · shrinkDur 0.7s · 先慢后快再慢（底边缩回 249→203）');
  const cc = calcCard(s);
  LOOP(2.2, t => {
    const u = t < 0.5 ? 1 : t < 1.2 ? 1 - CURVES.io((t - 0.5) / 0.7) : 0;
    cc.setH(203 + 46 * u); cc.chip.setAttribute('opacity', 0);
  });
}
/* ---- 第 8 章 徽章 ---- */
grid = DSEC('第 8 章 徽章', '数字跳变 0s（直接改写）');
{
  const s = dtile(grid, '8.1 数字跳变 · 0s · 1/4⇄2/4 直接换字');
  const c = animCard(s, 20, 15, { rank: 1, badge: { kind: 'prog', text: '1/4', w: 36 } });
  for (let i = 0; i < 4; i++) block(c.g, 40 + i * 58, 87, 46, i === 0 ? 'data' : 'empty', { letter: 'B' });
  const bt = c.g.childNodes[3].childNodes[1]; // 徽章文字
  LOOP(2.2, t => { bt.textContent = t < 1.1 ? '1/4' : '2/4'; });
}
/* ---- 第 9 章 播放行为 ---- */
grid = DSEC('第 9 章 播放行为', '播放控制不是动画单元：交互演示（点按试试）');
{
  const tile = document.createElement('div'); tile.className = 'tile'; grid.appendChild(tile);
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = '9.1 播放与暂停 · 点击切换（暂停＝冻结，再播续走）';
  const row = document.createElement('div'); row.className = 'ctrl';
  const b = document.createElement('div'); b.className = 'pbtn';
  let playing = true; b.appendChild(iconPlay(true));
  b.onclick = () => { playing = !playing; b.innerHTML = ''; b.appendChild(iconPlay(playing)); };
  row.appendChild(b); tile.appendChild(row); tile.appendChild(cap);
}
{
  const tile = document.createElement('div'); tile.className = 'tile'; grid.appendChild(tile);
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = '9.2 步进 · 下一步＝跳到下一步起点 · 上一步＝回上一步起点';
  const row = document.createElement('div'); row.className = 'ctrl';
  const tr = document.createElement('div'); tr.className = 'track';
  tr.style.cssText = 'width:220px;height:16px';
  const N = 5, segs = [];
  for (let i = 0; i < N; i++) { const sg = document.createElement('div'); sg.className = 'seg';
    sg.style.left = (i * 20) + '%'; sg.style.width = 'calc(20% - 4px)';
    const f = document.createElement('i'); f.style.width = '0'; sg.appendChild(f);
    tr.appendChild(sg); segs.push(f); }
  let cur = 0;
  function draw() { segs.forEach((f, i) => f.style.width = i < cur ? '100%' : '0'); }
  const b1 = document.createElement('div'); b1.className = 'sbtn'; b1.appendChild(iconStep('prev', '#6b7488'));
  b1.onclick = () => { cur = Math.max(0, cur - 1); draw(); };
  const b2 = document.createElement('div'); b2.className = 'sbtn'; b2.appendChild(iconStep('next', '#6b7488'));
  b2.onclick = () => { cur = Math.min(N, cur + 1); draw(); };
  row.appendChild(b1); row.appendChild(tr); row.appendChild(b2);
  tile.appendChild(row); tile.appendChild(cap);
}
{
  const tile = document.createElement('div'); tile.className = 'tile'; grid.appendChild(tile);
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = '9.3 进度条 · 点击/拖动拨时刻（页面刻度 0–1000 换算 0–1）· 悬浮变高';
  const tr = mkTrack(tile, [100, 100, 40, 0, 0, 0, 0, 0]);
  tr.style.maxWidth = '300px';
  function scrubTo(ev) {
    const r = tr.getBoundingClientRect(), u = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width));
    [...tr.querySelectorAll('.seg > i')].forEach((f, i, arr) => {
      const segU = u * arr.length - i;
      f.style.width = Math.max(0, Math.min(1, segU)) * 100 + '%';
    });
  }
  tr.onmousedown = ev => { scrubTo(ev);
    const mv = e2 => scrubTo(e2), up = () => { document.removeEventListener('mousemove', mv);
      document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up); };
  tile.appendChild(cap);
}
{
  const tile = document.createElement('div'); tile.className = 'tile'; grid.appendChild(tile);
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = '9.4 循环与速度 · 速度倍率作用于整页时间轴（大于 1 更快）';
  const tr = document.createElement('div');
  tr.style.cssText = 'position:relative;height:10px;background:#e6e9f0;border-radius:5px;margin:16px 20px';
  const dot = document.createElement('div');
  dot.style.cssText = 'position:absolute;top:-3px;width:16px;height:16px;border-radius:8px;background:' + DATA.A;
  tr.appendChild(dot); tile.appendChild(tr);
  const row = document.createElement('div'); row.className = 'ctrl'; row.style.height = '34px';
  let speed = 1;
  [0.5, 1, 2].forEach(v => { const b = document.createElement('div');
    b.className = 'sbtn'; b.style.width = '40px'; b.style.font = '700 13px Consolas';
    b.style.color = '#6b7488'; b.textContent = v + '×';
    b.onclick = () => { speed = v; [...row.children].forEach(c => c.style.color = '#6b7488'); b.style.color = '#161b2e'; };
    if (v === 1) b.style.color = '#161b2e';
    row.appendChild(b); });
  tile.appendChild(row); tile.appendChild(cap);
  let last = null, x = 0;
  (function run(now) { if (last != null) { x = (x + (now - last) / 1000 * speed * 140) % 280; }
    last = now; dot.style.left = (x - 8) + 'px'; requestAnimationFrame(run); })(performance.now());
}

/* ---- 7.1 版面（整条控制条，按容器宽缩放） ---- */
{
