<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Broadcast · 动态演示</title>
<link rel="stylesheet" href="assets/stage.css">
</head>
<body data-rel="broadcast">

<header class="hd">
  <h1>Broadcast</h1>
</header>

<main class="stagewrap">
  <div class="stagebox">
    <svg id="stage" viewBox="0 0 1200 640" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="Broadcast 通信过程动画：rank 0 把整份数据依次广播给 rank 1、2、3">
      <defs>
        <pattern id="gGrid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M40 0H0v40" fill="none" stroke="#8b93aa" stroke-opacity=".1" stroke-width="1"/>
        </pattern>
        <filter id="fCard" x="-40%" y="-40%" width="180%" height="190%">
          <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2a3352" flood-opacity=".1"/>
        </filter>
        <filter id="fGlow" x="-90%" y="-90%" width="280%" height="280%">
          <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#1a1f36" flood-opacity=".22"/>
        </filter>
        <filter id="fTrail" x="-90%" y="-90%" width="280%" height="280%">
          <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#1a1f36" flood-opacity=".14"/>
        </filter>
      </defs>

      <g id="lBg"></g>
      <g id="lCards"></g>
      <g id="lChips"></g>
      <g id="lWires"></g>
      <g id="lFx"></g>
      <g id="lLabels"></g>
    </svg>
  </div>
</main>

<footer class="bar">
  <div class="bar-stack">
    <div class="caption" id="caption">
      <span class="cap-text" id="capText"></span>
    </div>

    <div class="bar-panel">
      <div class="track">
        <div class="segs" id="segs"></div>
        <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="播放进度">
      </div>

      <div class="ctrls">
        <button class="ic ic-step" id="prev" aria-label="上一步" title="上一步">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M6 5h2.4v14H6zM19 5v14l-9.6-7z"/></svg>
        </button>
        <button class="ic ic-main" id="play" aria-label="播放" title="播放">
          <svg viewBox="0 0 24 24" width="25" height="25" fill="currentColor"><path d="M7 4.5v15L20 12z"/></svg>
        </button>
        <button class="ic ic-step" id="next" aria-label="下一步" title="下一步">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor"><path d="M15.6 5H18v14h-2.4zM5 5l9.6 7L5 19z"/></svg>
        </button>
      </div>
    </div>
  </div>
</footer>

<!-- 通用层：DOM 工具 / 绘制原语 / 播放控制 / 悬停聚焦 -->
<script src="assets/cv/dom.js"></script>
<script src="assets/cv/kit.js"></script>
<script src="assets/cv/controls.js"></script>
<script src="assets/cv/focus.js"></script>
<script src="assets/cv/relmap.js"></script>
<!-- 本页原语：只有数据、时间轴、文案、几何与渲染规则 -->
<script src="assets/broadcast.js"></script>
</body>
</html>
