<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CommonVisual · 分布式通信原语可视化</title>
<meta name="description" content="NCCL / torch.distributed 的 8 个集合通信原语可视化：Broadcast、Scatter、Gather、Reduce、All-Gather、All-Reduce、Reduce-Scatter、All-to-All，每个都有数据流动的完整演绎。">
<link rel="stylesheet" href="assets/index.css">
</head>
<body>

<div class="bg" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="mesh"></span>
</div>

<main class="wrap">

  <!-- ══════════════ 左：标题 ══════════════ -->
  <section class="hero">
    <h1 class="title">
      <span class="l">把集合通信</span>
      <span class="l">画成看得懂的</span>
      <span class="l">动<u>画</u></span>
    </h1>

    <p class="sub">
      8 个通信原语，每个都有数据怎么流动的完整演绎 —— 谁发出、经过谁、最后落在哪，一段一段看得清。
    </p>

    <a class="btn" href="gather.html">
      <span>看 Gather 跑一遍</span>
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
        <path class="bl" d="M2 8h11M9 4l4 4-4 4"/>
      </svg>
    </a>

    <p class="hero-alt">
      <a href="layout.html">八个原语的前后对照表</a>
      <span class="sep" aria-hidden="true">·</span>
      <a href="algorithms.html">算法骨架与实现方式</a>
      <span class="sep" aria-hidden="true">·</span>
      <a href="anatomy.html">组件与动效规范</a>
    </p>
  </section>

  <!-- ══════════════ 右：原语树 ══════════════ -->
  <section class="tree-panel">
    <div class="tree" id="tree">

      <!-- ── 左列 ── -->
      <a class="node" id="n-broadcast" href="broadcast.html" style="grid-column:1;grid-row:1">
        <span class="node-top">
          <span class="ranks" aria-hidden="true"><i class="on" style="--c:var(--c0)"></i><i></i><i></i><i></i></span>
          <span class="node-en">Broadcast</span>
        </span>
        <span class="node-bot">
          <span class="node-cn">广播</span>
          <span class="node-dir">1 → N</span>
        </span>
      </a>
      <div class="conn conn-v" data-k="broadcast" style="grid-column:1;grid-row:2;--d:0.400s" aria-hidden="true">
        <svg viewBox="0 0 20 34" width="20" height="34"><path class="ln" pathLength="1" d="M10 3V21"/><path class="fl" d="M10 3V21"/><path class="hd" d="M5.5 17 10 25 14.5 17"/></svg>
      </div>

      <a class="node" id="n-scatter" href="scatter.html" style="grid-column:1;grid-row:3">
        <span class="node-top">
          <span class="ranks" aria-hidden="true"><i class="on" style="--c:var(--c0)"></i><i></i><i></i><i></i></span>
          <span class="node-en">Scatter</span>
        </span>
        <span class="node-bot">
          <span class="node-cn">分散</span>
          <span class="node-dir">1 → N</span>
        </span>
      </a>
      <div class="conn conn-v" data-k="scatter" style="grid-column:1;grid-row:4;--d:0.475s" aria-hidden="true">
        <svg viewBox="0 0 20 34" width="20" height="34"><path class="ln" pathLength="1" d="M10 3V21"/><path class="fl" d="M10 3V21"/><path class="hd" d="M5.5 17 10 25 14.5 17"/></svg>
      </div>

      <!-- ── Gather ⟶ All-Gather ── -->
      <a class="node" id="n-gather" href="gather.html" style="grid-column:1;grid-row:5">
        <span class="node-top">
          <span class="ranks" aria-hidden="true"><i class="on" style="--c:var(--c0)"></i><i></i><i></i><i></i></span>
          <span class="node-en">Gather</span>
        </span>
        <span class="node-bot">
          <span class="node-cn">收集</span>
          <span class="node-dir">N → 1</span>
        </span>
      </a>
      <div class="conn conn-h" data-k="gather" style="grid-column:2;grid-row:5;--d:0.550s" aria-hidden="true">
        <svg viewBox="0 0 76 20" width="76" height="20"><path class="ln" pathLength="1" d="M4 10H58"/><path class="fl" d="M4 10H58"/><path class="hd" d="M54 5 62 10 54 15"/></svg>
      </div>
      <a class="node" id="n-allgather" href="allgather.html" style="grid-column:3;grid-row:5">
        <span class="node-top">
          <span class="ranks" aria-hidden="true"><i class="on" style="--c:var(--c0)"></i><i class="on" style="--c:var(--c1)"></i><i class="on" style="--c:var(--c2)"></i><i class="on" style="--c:var(--c3)"></i></span>
          <span class="node-en">All-Gather</span>
        </span>
        <span class="node-bot">
          <span class="node-cn">全收集</span>
          <span class="node-dir">N → N</span>
        </span>
      </a>

      <!-- ── Reduce ⟶ All-Reduce ── -->
      <div class="conn conn-v" data-k="gather" style="grid-column:1;grid-row:6;--d:0.625s" aria-hidden="true">
        <svg viewBox="0 0 20 34" width="20" height="34"><path class="ln" pathLength="1" d="M10 3V21"/><path class="fl" d="M10 3V21"/><path class="hd" d="M5.5 17 10 25 14.5 17"/></svg>
      </div>
      <a class="node" id="n-reduce" href="reduce.html" style="grid-column:1;grid-row:7">
        <span class="node-top">
          <span class="ranks" aria-hidden="true"><i class="on" style="--c:var(--c0)"></i><i></i><i></i><i></i></span>
          <span class="node-en">Reduce</span>
        </span>
        <span class="node-bot">
          <span class="node-cn">归约</span>
          <span class="node-dir">N → 1</span>
        </span>
      </a>
      <div class="conn conn-h" data-k="reduce" style="grid-column:2;grid-row:7;--d:0.700s" aria-hidden="true">
        <svg viewBox="0 0 76 20" width="76" height="20"><path class="ln" pathLength="1" d="M4 10H58"/><path class="fl" d="M4 10H58"/><path class="hd" d="M54 5 62 10 54 15"/></svg>
      </div>
      <div class="conn conn-v" data-k="allgather" style="grid-column:3;grid-row:6;--d:0.775s" aria-hidden="true">
        <svg viewBox="0 0 20 34" width="20" height="34"><path class="ln" pathLength="1" d="M10 3V21"/><path class="fl" d="M10 3V21"/><path class="hd" d="M5.5 17 10 25 14.5 17"/></svg>
      </div>
      <a class="node" id="n-allreduce" href="allreduce.html" style="grid-column:3;grid-row:7">
        <span class="node-top">
          <span class="ranks" aria-hidden="true"><i class="on" style="--c:var(--c0)"></i><i class="on" style="--c:var(--c1)"></i><i class="on" style="--c:var(--c2)"></i><i class="on" style="--c:var(--c3)"></i></span>
          <span class="node-en">All-Reduce</span>
        </span>
        <span class="node-bot">
          <span class="node-cn">全归约</span>
          <span class="node-dir">N → N</span>
        </span>
      </a>

      <!-- ── 右列续 ── -->
      <div class="conn conn-v" data-k="allreduce" style="grid-column:3;grid-row:8;--d:0.850s" aria-hidden="true">
        <svg viewBox="0 0 20 34" width="20" height="34"><path class="ln" pathLength="1" d="M10 3V21"/><path class="fl" d="M10 3V21"/><path class="hd" d="M5.5 17 10 25 14.5 17"/></svg>
      </div>
      <a class="node" id="n-reducescatter" href="reducescatter.html" style="grid-column:3;grid-row:9">
        <span class="node-top">
          <span class="ranks" aria-hidden="true"><i class="on" style="--c:var(--c0)"></i><i class="on" style="--c:var(--c1)"></i><i class="on" style="--c:var(--c2)"></i><i class="on" style="--c:var(--c3)"></i></span>
          <span class="node-en">Reduce-Scatter</span>
        </span>
        <span class="node-bot">
          <span class="node-cn">归约分散</span>
          <span class="node-dir">N → N</span>
        </span>
      </a>
      <div class="conn conn-v" data-k="reducescatter" style="grid-column:3;grid-row:10;--d:0.925s" aria-hidden="true">
        <svg viewBox="0 0 20 34" width="20" height="34"><path class="ln" pathLength="1" d="M10 3V21"/><path class="fl" d="M10 3V21"/><path class="hd" d="M5.5 17 10 25 14.5 17"/></svg>
      </div>
      <a class="node" id="n-alltoall" href="alltoall.html" style="grid-column:3;grid-row:11">
        <span class="node-top">
          <span class="ranks" aria-hidden="true"><i class="on" style="--c:var(--c0)"></i><i class="on" style="--c:var(--c1)"></i><i class="on" style="--c:var(--c2)"></i><i class="on" style="--c:var(--c3)"></i></span>
          <span class="node-en">All-to-All</span>
        </span>
        <span class="node-bot">
          <span class="node-cn">全互换</span>
          <span class="node-dir">N → N</span>
        </span>
      </a>

    </div>
  </section>

</main>

<div class="toast" role="status" aria-live="polite"></div>

<script src="assets/index.js"></script>
</body>
</html>
