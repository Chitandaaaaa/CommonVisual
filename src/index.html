<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>CommonVisual · 8 种分布式通信原语</title>
<style>
  body { margin:0; background:#f5f6f8; color:#1c2130; font:15px/1.7 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:48px 24px 80px; }
  h1 { font-size:26px; margin:0 0 6px; }
  .sub { color:#7a8296; font-size:13px; margin-bottom:28px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  a.card { display:block; background:#fff; border:1px solid #e4e7ee; border-radius:12px;
    padding:14px 16px; text-decoration:none; color:inherit; box-shadow:0 1px 3px rgba(20,25,40,.06); }
  a.card b { color:#7c3aed; font-family:ui-monospace,Menlo,monospace; font-size:12px; margin-right:8px; }
  a.card:hover { border-color:#ddd4fb; }
  .dir { color:#7a8296; font-size:12px; float:right; }
  footer { margin-top:32px; color:#a6adc0; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>8 种分布式通信原语</h1>
  <div class="sub">零构建静态实现 · 规范源在 docs/规范/（②–⑦）· 双击任意页即看</div>
  <div class="grid" id="g"></div>
  <footer>实现文档在 docs/实现/；冲烟验证：node src/dev/verify.mjs</footer>
</div>
<script>
var items = [
  ['broadcast', 'Broadcast · 广播', '1 → N'],
  ['scatter', 'Scatter · 分散', '1 → N'],
  ['gather', 'Gather · 收集', 'N → 1'],
  ['allgather', 'All-Gather · 全收集', 'N → N'],
  ['reduce', 'Reduce · 归约', 'N → 1'],
  ['allreduce', 'All-Reduce · 全归约', 'N → N'],
  ['reducescatter', 'Reduce-Scatter · 归约分散', 'N → N'],
  ['alltoall', 'All-to-All · 全互换', 'N → N']
];
document.getElementById('g').innerHTML = items.map(function (it) {
  return '<a class="card" href="' + it[0] + '.html"><b>' + it[0] + '</b>' + it[1] +
         '<span class="dir">' + it[2] + '</span></a>';
}).join('');
</script>
</body>
</html>
